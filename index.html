const sigIn=()=>{const im=w=>S.sig[w]?`<img src="${S.sig[w]}" alt="">`:'';return `<div class="sg"><div><p>Mengetahui,<br>Kepala MTsN 3 Subang</p><div class="sgi">${im('kp')}</div><div class="nm">${esc(S.id.kp)||'&nbsp;'}</div><p>NIP. ${esc(S.id.nk)||'....................'}</p></div><div><p>Subang, ${tgl(S.id.tg)}<br>Supervisor,</p><div class="sgi">${im('sp')}</div><div class="nm">${esc(S.id.sp)||'&nbsp;'}</div><p>NIP. ${esc(S.id.ns)||'....................'}</p></div></div>`};
const sig=()=>`<div id="sgb">${sigIn()}</div><div class="it no"><b>Tanda tangan digital</b><p class="m">Tanda tangani dengan jari atau mouse pada kotak di bawah. Hasilnya langsung tampil di blok tanda tangan.</p><div class="pads"><div>Supervisor<canvas class="pad" width="360" height="140" data-w="sp"></canvas><button type="button" class="btn o" data-clr="sp">Hapus</button></div><div>Kepala madrasah<canvas class="pad" width="360" height="140" data-w="kp"></canvas><button type="button" class="btn o" data-clr="kp">Hapus</button></div></div></div>`;
const refSig=()=>{const e=document.getElementById('sgb');if(e)e.innerHTML=sigIn()};
function pads(){document.querySelectorAll('canvas.pad').forEach(c=>{const x=c.getContext('2d'),w=c.dataset.w;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
if(S.sig[w]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=S.sig[w]}
x.lineWidth=2.5;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';let d=0;
const pt=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();e.preventDefault()};
c.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
c.onpointerup=c.onpointercancel=()=>{if(!d)return;d=0;S.sig[w]=c.toDataURL('image/png');save();refSig()}})}
