const tgl=v=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v||'');return m?(+m[3])+' '+BL[+m[2]-1]+' '+m[1]:'........ Juli 2026'};
const sigIn=()=>{const im=w=>S.sig[w]?`<img class="${w}" src="${S.sig[w]}" alt="">`:'';return `<div class="sg"><div><p>Mengetahui,<br>Kepala MTsN 3 Subang</p><div class="sgi"><img class="kp" src="${LGT}" alt="Tanda tangan dan stempel kepala"></div><div class="nm">${esc(S.id.kp)||'&nbsp;'}</div><p>NIP. ${esc(S.id.nk)||'....................'}</p></div><div><p>Subang, ${tgl(S.id.tg)}<br>Supervisor,</p><div class="sgi">${im('sp')}</div><div class="nm">${esc(S.id.sp)||'&nbsp;'}</div><p>NIP. ${esc(S.id.ns)||'....................'}</p></div></div>`};
const sig=()=>`<div id="sgb">${sigIn()}</div><div class="it no"><b>Tanda tangan digital supervisor</b><p class="m">Tanda tangani dengan jari atau mouse pada kotak di bawah. Hasilnya langsung tampil di blok tanda tangan.</p><div class="pads"><div>Supervisor<canvas class="pad" width="360" height="140" data-w="sp"></canvas><button type="button" class="btn o" data-clr="sp">Hapus</button></div></div></div>`;
const refSig=()=>{const e=document.getElementById('sgb');if(e)e.innerHTML=sigIn()};
function pads(){document.querySelectorAll('canvas.pad').forEach(c=>{const x=c.getContext('2d'),w=c.dataset.w;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
if(S.sig[w]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=S.sig[w]}
x.lineWidth=2.5;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';let d=0;
const pt=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();e.preventDefault()};
c.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
c.onpointerup=c.onpointercancel=()=>{if(!d)return;d=0;S.sig[w]=c.toDataURL('image/png');save();refSig()}})}

const weak=[];I.forEach(x=>(S.a[x.k]||[]).forEach((v,i)=>{if(v&&v<=2)weak.push(x.it[i][0])}));
let kes;if(D.length){const bs=D.reduce((m,o)=>o.r.p>m.r.p?o:m),ws=D.reduce((m,o)=>o.r.p<m.r.p?o:m);kes=`Berdasarkan rekapitulasi nilai sebesar ${a}% (Kategori ${pred(a)}), guru yang bersangkutan menunjukkan capaian terbaik pada ${bs.x.t.toLowerCase()} (${bs.r.p}%).`+(weak.length?` Prioritas pembinaan selanjutnya terfokus pada ${weak.slice(0,4).map(w=>w.toLowerCase()).join(', ')}${D.length>1?`, dengan capaian terendah pada ${ws.x.t.toLowerCase()} (${ws.r.p}%)`:''}.`:' Seluruh butir berada pada kategori baik atau lebih; pertahankan dan tingkatkan kinerja yang sudah ada.')}else kes='Lengkapi minimal satu instrumen untuk menampilkan kesimpulan.';

<table class="ri"><tr><td>Nama Guru</td><td>: ${esc(S.id.g)||'-'}</td><td>Tanggal Supervisi</td><td>: ${S.id.tg?tgl(S.id.tg):'-'}</td></tr><tr><td>NIP Guru</td><td>: ${esc(S.id.ng)||'-'}</td><td>Kelas / Sasaran</td><td>: ${esc(S.id.kl)||'-'}</td></tr><tr><td>Mata Pelajaran</td><td>: ${esc(S.id.m)||'-'}</td><td>Supervisor</td><td>: ${sp}</td></tr></table>
<div class="rsec">I. RINGKASAN CAPAIAN SUPERVISI</div><div class="cards">${R.map(card).join('')}<div class="cd"><small>NILAI RATA-RATA</small><div class="v" style="color:${D.length?col(a):'inherit'}">${D.length?a+'%':'-'}</div><span class="pl">KATEGORI: ${D.length?pred(a).toUpperCase():'-'}</span></div></div>${fx}
${R.map(sect).join('')}
<div class="rsec">V. ANALISIS UMPAN BALIK DAN RENCANA TINDAK LANJUT</div><div class="fb"><div><h4>✔ Kekuatan Utama Yang Teramati</h4>${ul(lines(S.n['04s0']),'Belum diisi')}</div><div><h4>⚠ Aspek Yang Perlu Diperbaiki</h4>${ul(lines(S.n['04s1']),'Belum diisi')}</div><div><h4>📌 Rencana Action Plan (Tindak Lanjut)</h4>${ul(lines(S.n['04s2']),'Belum diisi')}</div><div><h4>💬 Tanggapan Guru Terperiksa</h4>${lines(S.n['04s3']).length?'<p><i>"'+lines(S.n['04s3']).map(esc).join('; ')+'"</i></p>':'<p class="m">Belum diisi</p>'}</div></div>
<div class="rsec">VI. REKOMENDASI SUPERVISOR &amp; KESIMPULAN</div><p style="margin:0">${kes}</p>${sig()}</div><button class="btn no" onclick="print()">Cetak atau simpan PDF</button><button class="btn o no" id="rst">Hapus semua data</button>`;
document.getElementById('pR').innerHTML=h;pads()}

[['04s0','Sudah baik: ',g[0]],['04s1','Perlu diperbaiki: ',g[1]]].forEach(([n,p,l])=>{const ta=document.querySelector(`textarea[data-n="${n}"]`);l.forEach(z=>{const s='- '+p+z;if(!ta.value.includes(s))ta.value+=(ta.value?'\n':'')+s});S.n[n]=ta.value});save()}
